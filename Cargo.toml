[package]
name = "pcif"
version = "0.1.0"
edition = "2021"
description = "Page-Cache Integrity Fuzzer: differential fuzzing for zero-copy syscall paths"
license = "MIT"

[dependencies]
nix = { version = "0.29", features = ["fs", "mman", "socket", "uio", "poll", "sched"] }
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
libc = "0.2"
hex = "0.4"
blake3 = "1"

[profile.release]
opt-level = 2
debug = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
